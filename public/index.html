<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Canteen - Good Food, Better Mood</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-['Plus_Jakarta_Sans',sans-serif] antialiased min-h-screen flex flex-col pb-16 md:pb-0">

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="#/" class="flex items-center gap-2.5 group cursor-pointer">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
          <i data-lucide="utensils-cross" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight text-slate-900 flex items-center gap-1.5">
            Smart<span class="text-brand-600">Canteen</span>
          </span>
          <span class="text-[10px] text-slate-400 font-medium block -mt-1 tracking-wider uppercase">Good Food, Better Mood</span>
        </div>
      </a>

      <!-- Desktop Nav Links -->
      <nav id="desktop-nav-links" class="hidden md:flex items-center gap-1">
        <!-- Rendered dynamically based on role -->
      </nav>

      <!-- Right Header Actions (Wallet, Cart, Profile/Auth) -->
      <div class="flex items-center gap-3">
        
        <!-- Wallet Pill (for logged-in customers) -->
        <div id="header-wallet-pill" class="hidden">
          <button onclick="App.navigateTo('#/profile')" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 transition-colors text-emerald-800 text-xs font-semibold shadow-xs">
            <i data-lucide="wallet" class="w-3.5 h-3.5 text-emerald-600"></i>
            <span id="header-wallet-balance">₹0.00</span>
          </button>
        </div>

        <!-- Cart Button -->
        <button id="header-cart-btn" onclick="App.toggleCartDrawer(true)" class="relative p-2.5 text-slate-600 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-colors" title="View Cart">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span id="cart-badge" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-brand-600 text-white rounded-full text-[11px] font-bold flex items-center justify-center shadow-sm">0</span>
        </button>

        <!-- Role Badge / Quick Switcher -->
        <div class="relative group">
          <button id="role-pill-btn" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">
            <span id="current-role-label">Guest</span>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-500"></i>
          </button>
          <div class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 py-1.5 hidden group-hover:block group-focus-within:block z-50">
            <div class="px-3 py-1.5 text-[10px] uppercase font-bold text-slate-400 tracking-wider">Quick Switch Role</div>
            <button onclick="App.switchRole('customer')" class="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-blue-500"></span> Student / Customer
            </button>
            <button onclick="App.switchRole('kitchen')" class="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span> Kitchen Staff
            </button>
            <button onclick="App.switchRole('admin')" class="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-purple-500"></span> Canteen Admin
            </button>
          </div>
        </div>

        <!-- Auth Button -->
        <div id="auth-btn-container">
          <button onclick="App.openAuthModal('login')" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold rounded-xl shadow-sm transition-all hover:shadow-brand-500/25">
            Login
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- ================= MAIN VIEWPORT ================= -->
  <main id="app-viewport" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Dynamic views render here -->
  </main>

  <!-- ================= MOBILE BOTTOM NAVIGATION ================= -->
  <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2 flex items-center justify-around shadow-lg">
    <!-- Dynamically rendered based on active route and role -->
  </nav>

  <!-- ================= CART DRAWER / SLIDE-OVER ================= -->
  <div id="cart-drawer-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 transition-opacity opacity-0 pointer-events-none" onclick="App.toggleCartDrawer(false)"></div>
  <aside id="cart-drawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-white z-50 shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
    <!-- Header -->
    <div class="p-4 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
        </div>
        <h2 class="text-base font-bold text-slate-900">Your Tray (<span id="cart-drawer-count">0</span>)</h2>
      </div>
      <button onclick="App.toggleCartDrawer(false)" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Cart Items List (Scrollable) -->
    <div id="cart-drawer-items" class="flex-1 overflow-y-auto p-4 divide-y divide-slate-100">
      <!-- Items dynamically populated -->
    </div>

    <!-- Special Instructions & Payment Selection -->
    <div id="cart-drawer-footer" class="border-t border-slate-100 p-4 bg-slate-50 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Cooking Note (Optional)</label>
        <input type="text" id="cart-special-notes" placeholder="e.g. Less spicy, extra sauce..." class="w-full text-xs px-3 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-brand-500">
      </div>

      <!-- Payment Method Selector -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Payment Method</label>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center gap-2 p-2.5 border rounded-xl bg-white cursor-pointer hover:border-brand-500 transition-colors text-xs font-medium has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50/50 has-[:checked]:text-brand-900">
            <input type="radio" name="payment_method" value="wallet" checked class="text-brand-600 focus:ring-brand-500">
            <div class="flex flex-col">
              <span class="font-bold flex items-center gap-1"><i data-lucide="wallet" class="w-3.5 h-3.5 text-emerald-600"></i> Canteen Wallet</span>
              <span class="text-[10px] text-slate-500">Bal: <span id="cart-wallet-avail">₹0.00</span></span>
            </div>
          </label>
          <label class="flex items-center gap-2 p-2.5 border rounded-xl bg-white cursor-pointer hover:border-brand-500 transition-colors text-xs font-medium has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50/50 has-[:checked]:text-brand-900">
            <input type="radio" name="payment_method" value="cash" class="text-brand-600 focus:ring-brand-500">
            <div class="flex flex-col">
              <span class="font-bold flex items-center gap-1"><i data-lucide="banknote" class="w-3.5 h-3.5 text-blue-600"></i> Pay at Counter</span>
              <span class="text-[10px] text-slate-500">Cash / UPI at pickup</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Bill Breakdown -->
      <div class="space-y-1.5 text-xs text-slate-600 pt-2 border-t border-slate-200">
        <div class="flex justify-between">
          <span>Subtotal</span>
          <span id="cart-subtotal" class="font-medium text-slate-900">₹0.00</span>
        </div>
        <div class="flex justify-between">
          <span>GST / Canteen Tax (5%)</span>
          <span id="cart-tax" class="font-medium text-slate-900">₹0.00</span>
        </div>
        <div class="flex justify-between text-sm font-bold text-slate-900 pt-1 border-t border-slate-200">
          <span>Grand Total</span>
          <span id="cart-total" class="text-brand-600 font-extrabold text-base">₹0.00</span>
        </div>
      </div>

      <!-- Checkout Button -->
      <button id="cart-checkout-btn" onclick="App.handleCheckout()" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md shadow-brand-500/25 flex items-center justify-center gap-2 transition-all">
        <span>Confirm & Place Order</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </aside>

  <!-- ================= AUTHENTICATION MODAL ================= -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative border border-slate-100">
      <button onclick="App.closeAuthModal()" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-600 rounded-lg">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      
      <!-- Modal Tabs -->
      <div class="flex border-b border-slate-100 mb-5">
        <button id="tab-login-btn" onclick="App.switchAuthTab('login')" class="flex-1 pb-3 text-sm font-bold text-brand-600 border-b-2 border-brand-600">Sign In</button>
        <button id="tab-register-btn" onclick="App.switchAuthTab('register')" class="flex-1 pb-3 text-sm font-medium text-slate-400 hover:text-slate-600">Register</button>
      </div>

      <!-- Quick Test Accounts Chip Helper -->
      <div class="mb-4 p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs">
        <div class="font-semibold text-slate-700 mb-1.5 flex items-center gap-1.5">
          <i data-lucide="key" class="w-3.5 h-3.5 text-amber-500"></i> Demo One-Click Fill:
        </div>
        <div class="flex flex-wrap gap-1.5">
          <button onclick="App.fillTestCredentials('student@canteen.edu', 'Student@123')" class="px-2 py-1 bg-white border border-slate-200 rounded-md text-[11px] font-medium text-slate-700 hover:border-brand-500 hover:text-brand-600 transition-colors">
            Student
          </button>
          <button onclick="App.fillTestCredentials('kitchen@canteen.edu', 'Kitchen@123')" class="px-2 py-1 bg-white border border-slate-200 rounded-md text-[11px] font-medium text-slate-700 hover:border-brand-500 hover:text-brand-600 transition-colors">
            Kitchen
          </button>
          <button onclick="App.fillTestCredentials('admin@canteen.edu', 'Admin@123')" class="px-2 py-1 bg-white border border-slate-200 rounded-md text-[11px] font-medium text-slate-700 hover:border-brand-500 hover:text-brand-600 transition-colors">
            Admin
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="App.handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Campus Email</label>
          <input type="email" id="login-email" required placeholder="e.g. student@canteen.edu" class="w-full text-sm px-3.5 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full text-sm px-3.5 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500">
        </div>
        <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-sm shadow-md shadow-brand-500/25 transition-all">
          Sign In
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" onsubmit="App.handleRegister(event)" class="space-y-3.5 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
          <input type="text" id="reg-name" required placeholder="Kanishk Sharma" class="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Campus Email</label>
          <input type="email" id="reg-email" required placeholder="kanishk@canteen.edu" class="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Mobile Number</label>
          <input type="tel" id="reg-phone" placeholder="+91 98765 43210" class="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Password (min 6 chars)</label>
          <input type="password" id="reg-password" minlength="6" required placeholder="••••••••" class="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500">
        </div>
        <p class="text-[11px] text-emerald-600 font-medium flex items-center gap-1">
          <i data-lucide="gift" class="w-3.5 h-3.5"></i> You'll get ₹500 starting test wallet credit!
        </p>
        <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-sm shadow-md shadow-brand-500/25 transition-all">
          Create Account
        </button>
      </form>
    </div>
  </div>

  <!-- ================= GLOBAL TOAST NOTIFICATION CONTAINER ================= -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Scripts -->
  <script src="js/seed-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/views/landing-view.js"></script>
  <script src="js/views/menu-view.js"></script>
  <script src="js/views/tracker-view.js"></script>
  <script src="js/views/history-view.js"></script>
  <script src="js/views/profile-view.js"></script>
  <script src="js/views/kitchen-view.js"></script>
  <script src="js/views/admin-dash-view.js"></script>
  <script src="js/views/admin-menu-view.js"></script>
  <script src="js/views/admin-orders-view.js"></script>
  <script src="js/views/admin-reports-view.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
